name: begreen

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: begreenmyfriend-php:8.3
    container_name: begreen-php
    working_dir: /app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_SECRET: ${APP_SECRET:-change-me}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-null://null}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
      SECONDARY_LOCALE: ${SECONDARY_LOCALE:-en}
      LOCALES: ${LOCALES:-es,en}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@example.com}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@example.com}
      ORS_API_KEY: ${ORS_API_KEY:-}
      EWZ_RECAPTCHA_PUBLIC_KEY: ${EWZ_RECAPTCHA_PUBLIC_KEY:-}
      EWZ_RECAPTCHA_PRIVATE_KEY: ${EWZ_RECAPTCHA_PRIVATE_KEY:-}
      GOOGLE_RECAPTCHA_SITE_KEY: ${GOOGLE_RECAPTCHA_SITE_KEY:-}
      GOOGLE_RECAPTCHA_SECRET_KEY: ${GOOGLE_RECAPTCHA_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_var:/app/var
      - app_uploads:/app/public/uploads
      - app_build:/app/public/build

  nginx:
    image: nginx:1.27-alpine
    container_name: begreen-nginx
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_var:/app/var:ro
      - app_uploads:/app/public/uploads:ro
      - app_build:/app/public/build:ro

  db:
    image: mariadb:11.3
    container_name: begreen-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-begreenmyfriend}
      MARIADB_USER: ${MARIADB_USER:-begreen}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-begreen}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
    name: app_db_data
  app_var:
    name: app_app_var
  app_uploads:
    name: app_app_uploads
  app_build:
    name: app_app_build
  app_vendor:
    name: app_app_vendor
  app_node_modules:
    name: app_app_node_modules
