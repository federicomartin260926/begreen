    '002': "It is no longer an intention. It is a commitment the team will experience every day."
    '003': "One level higher. And the set ahead will be better for it."
    '004': "You did it. And that was only the beginning."
    '005': "The team does not know it yet, but the shoot ahead is already better because of this."
    '006': "Level completed. What you built here is now part of the next set."
    '007': "From Seed to Plant. The team is beginning to grow roots it can rely on."
    '008': "This shoot has just taken a step many never take. Yours did."
    '009': "You moved up. And the best part is that this has only just begun."
    '010': "One level up. The team that follows will notice, even if they do not know where it came from."
  tree:
    '001': "Your team will shoot on a set that someone cared for before they arrived. That someone is you."
    '002': "Another shoot, but a team that already works differently."
    '003': "What you have built here reaches the set, every department and every day."
    '004': "Tree. The plan has roots now. The team has solid ground to work on."
    '005': "You moved up. And the set ahead is already different because of the decisions you made here."
    '006': "Level completed. The team now has a plan worth taking to the set."
    '007': "What you built here is now part of this shoot's DNA."
    '008': "The team does not yet know what awaits them. But something good awaits them."
    '009': "From Plant to Tree. The plan has structure now. It already provides shade for those working beneath it."
    '010': "You moved up a level. And the team shooting it will appreciate it every day."
  forest:
    '001': "Forest. Your shoot now has the depth teams remember when it is over."
    '002': "You reached the level where the team begins to notice that something about this shoot is different. Special."
    '003': "This is not achieved all at once. It is built one decision at a time, just as you did."
    '004': "The team working here will experience something very few teams are lucky enough to have."
    '005': "Forest. The plan is now a complete ecosystem. The team has everything it needs."
    '006': "You moved up. And the team shooting it will have a set worth working on."
    '007': "What you have built now has a life of its own. The team will feel it every day."
    '008': "Forest level. The shoot is now something the entire team can be proud of."
    '009': "You made it. And the team following you will find something extraordinary."
    '010': "From Tree to Forest. The impact is no longer yours alone. It belongs to the whole team."
  jungle:
    '001': "Jungle. The team shooting this will be part of something very few productions have achieved."
    '002': "Your team is already working in the future of the industry, without knowing it yet."
    '003': "You made it. And the team will experience it every day of the shoot."
    '004': "The team working on this set will be part of something worth talking about."
    '005': "Jungle. The plan is complete. The team has everything it needs to create something memorable."
    '006': "What you built here is extraordinary. And the team will feel it from day one."
    '007': "You reached the highest level. The team now has the set it deserved."
    '008': "From Forest to Jungle. The impact no longer has limits. Neither does the team."
    '009': "You reached the final level. And the team that follows has something incredible waiting for them."
    '010': "Jungle. Your team now has the most sustainable and carefully designed shoot you could give them."

