welcome:
  seed:
    '001': "Every great shoot begins with a decision. This one is yours."
    '002': "The team building this today is the team that will shoot differently tomorrow."
    '003': "Someone has to begin. And that someone is you."
    '004': "The first step towards a sustainable set begins here, long before the first day of shooting."
    '005': "This is the moment when a production decides what kind of production it wants to be."
    '006': "Welcome. What you build here will reach the set before any equipment truck does."
    '007': "A mindful set begins with people asking the right questions. You are already asking them."
    '008': "This is the beginning. And beginnings are always the most important moment."
    '009': "The team arriving on this set will find something that someone cared for before they appeared."
    '010': "You do not need to have everything figured out to begin. You just need to begin."
  plant:
    '001': "Your team does not yet know how much this plan will change their day-to-day work. They soon will."
    '002': "A more mindful shoot is also one where the team works better."
    '003': "You are building something the team will appreciate, even if they do not always say so."
    '004': "It is no longer an intention. It is a real plan, with decisions and a team behind it."
    '005': "Every choice you make here becomes a concrete instruction for the team on set."
    '006': "The team arriving on this set is joining a project that thought about them before it began."
    '007': "This is beginning to take shape. Teams notice when they work on something with a clear shape."
    '008': "Welcome to the level where decisions begin to have a real impact on daily life on set."
    '009': "Your production already has something many others do not: a clear direction towards something better."
    '010': "Teams work better when they know someone thought about all this before they arrived."
  tree:
    '001': "From this point on, your decisions do more than shape the shoot. They shape how the team works."
    '002': "The team arriving on this set is joining a project that took what matters seriously."
    '003': "You have reached the point where the plan stops being a document and becomes team culture."
    '004': "Halfway there, but already with more real impact than most productions achieve in their entire lifetime."
    '005': "At this level, the set already feels different. The team notices from day one."
    '006': "Welcome to the level where sustainability stops being an effort and becomes a way of shooting."
    '007': "The team working here will be part of something built with purpose. That changes everything."
    '008': "You have reached the halfway point. The second half is where productions truly make a difference."
    '009': "From here on, every decision you make has an impact that reaches far beyond the set."
    '010': "The plan now has substance. The team has clear instructions. Now it is time to go after the rest."
  forest:
    '001': "The team working on this project is working on something worthwhile. And they know it."
    '002': "You are designing the kind of shoot the team speaks well of when it is over."
    '003': "Here, sustainability is no longer an add-on. It is part of how the team works."
    '004': "At this level, the plan no longer needs anyone to explain it. It lives naturally on set."
    '005': "The team joining this shoot will find something built with an uncommon level of care."
    '006': "Welcome to the level where productions leave a mark for the right reasons."
    '007': "What you are building already goes beyond the set. It is part of how this team understands its work."
    '008': "At this level, the plan is a statement of intent the team can feel every day."
    '009': "The team shooting this will work on something considered down to the last detail. That is a gift."
    '010': "Here, the plan already breathes on its own. The team only needs to follow it and let it guide them."
  jungle:
    '001': "Your team will work on a set where every decision was made with care. You can feel that."
    '002': "A shoot at this level is never improvised. It is the result of every choice you made along the way."
    '003': "The team arriving on this set is joining something different. You made it possible."
    '004': "You are at the level where sustainability stops being an effort and becomes the team's standard."
    '005': "The set ahead is already extraordinary. The team is about to discover it."
    '006': "Here, the plan no longer needs an explanation. The team will live it without anyone having to tell them."
    '007': "Welcome to the level where shoots stop having unresolved problems and start having solutions ready to use."
    '008': "The team working here will experience something few teams in the world have had the chance to live."
    '009': "At this level, the plan is already part of the team. It is no longer a document: it is a shared way of being."
    '010': "Everything you have built culminates here. The team is about to experience it."

level_up:
