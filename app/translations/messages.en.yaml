# === HOME ===
home:
  title_1: "Generate emotions and reduce emissions"
  text_1: "We help you make your filming and events more sustainable, offering innovative solutions to reduce environmental impact and contribute to a more responsible future."

  step_label: "Step"
  step_1_title: "We develop your sustainability plan"
  step_1_text: "We analyze each script or event in detail to create a customized sustainability plan, applying best practices to minimize environmental impact and achieve a more sustainable production."
  step_1_text_li_1: "We look for the best solutions and suppliers so you can save time, money, and energy."
  step_1_text_li_2: "We identify critical points and develop strategies to implement sustainable solutions."
  step_1_text_li_3: "We develop an emissions reduction plan without compromising on deadlines, quality or budget."

  step_2_title: "We measure the carbon footprint of your shoot or event"
  step_2_text: "Our Ecomanager is responsible for collecting data, managing waste separation, and raising awareness among each department to ensure compliance with all sustainability plan measures."
  step_2_text_li_1: "View real-time emissions calculations by department, person, category, and scope"
  step_2_text_li_2: "We monitor compliance with the measures approved in the project's sustainability plan."
  step_2_text_li_3: "We prepare a final sustainability report to assess the impact and raise awareness among the team for the future"

  step_3_title: "And if you can't reduce further, we compensate and certify"
  step_3_text: "Once we've exhausted the 7Rs: Redesign, Reduce, Reuse, Repair, Renew, Recover, and Recycle, all that's left is to offset our project's emissions."
  step_3_text_li_1: "We offset emissions to become carbon neutral by reforesting, purchasing carbon credits, or restoring ecosystems."
  step_3_text_li_2: "We certify any project with the main seals in the market"
  step_3_text_li_3: "We manage an external audit for you, if you need it."

  form:
    title: "Your commitment to sustainability starts here"

