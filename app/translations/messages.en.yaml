          <li><strong>Duplicates:</strong> A row with the same <em>Name (ES)</em> and <em>Category</em> is considered a duplicate; it will be counted both as a <em>duplicate</em> and within <em>errors</em>.</li>
          <li><strong>Template download:</strong> The template is always generated in ES to keep consistency.</li>
