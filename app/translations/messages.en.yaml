      lang_info_html: >
        <ul class="mb-0 ps-3">
          <li><strong>Template and base data in ES:</strong> Columns <em>A–W</em> must be filled in Spanish. <em>Protocol</em> can be a code or a name. <em>GHG Category</em>, <em>Category</em>, <em>Block</em>, <em>Departments</em>, <em>SDGs</em>, <em>ESG</em>, <em>Scope</em>, <em>Impact areas</em>, <em>Triple balance</em> and <em>Verification sources</em> must exist in the corresponding measure catalog.</li>
          <li><strong>Multiple fields:</strong> <em>Departments</em>, <em>SDGs</em>, <em>Impact areas</em> and <em>Triple balance</em> accept values separated by <code>;</code>. <em>Verification sources</em> use the format <code>1. Foto | 2. Factura / Albarán | 3. Certif. / Licencia</code>.</li>
          <li><strong>Optional EN fields:</strong> Columns <em>S–W</em> are optional and saved as translations (<code>en</code>).</li>
          <li><strong>Score (1–5):</strong> Column <em>J</em> accepts integers between 1 and 5.</li>
          <li><strong>Mandatory:</strong> Column <em>K</em> accepts <em>Yes</em>/<em>No</em> (also <code>sí/no</code>, <code>true/false</code>, <code>1/0</code> accepted).</li>
          <li><strong>Template download:</strong> The template is always generated in ES to keep consistency.</li>
        </ul>
