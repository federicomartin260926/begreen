# === HOME ===
home:
  title_1: "Genera emociones y reduce emisiones"
  text_1: "Te ayudamos a hacer tus rodajes y eventos más sostenibles, ofreciendo soluciones innovadoras para reducir el impacto ambiental y contribuir a un futuro más responsable."

  step_label: "Paso"
  step_1_title: "Elaboramos tu plan de sostenibilidad"
  step_1_text: "Analizamos cada guion o evento en detalle para crear un plan de sostenibilidad personalizado, aplicando las mejores prácticas para minimizar el impacto ambiental y lograr una producción más sostenible."
  step_1_text_li_1: "Buscamos las mejores soluciones y proveedores para que ahorres tiempo, coste y energía"
  step_1_text_li_2: "Detectamos los puntos críticos y elaboramos estrategias para implantar soluciones sostenibles"
  step_1_text_li_3: "Elaboramos un plan de reducción de emisiones sin comprometer plazos, calidad o presupuesto"

  step_2_title: "Medimos la huella de carbono de tu rodaje o evento"
  step_2_text: "Nuestro Ecomanager se encarga de recolectar datos, gestionar la separación de residuos y concienciar a cada departamento para cumplir todas las medidas del plan de sostenibilidad."
  step_2_text_li_1: "Visualiza en tiempo real los cálculos de las emisiones por departamento, persona, categoría y alcance"
  step_2_text_li_2: "Supervisamos el cumplimiento de las medidas aprobadas en el plan de sostenibilidad del proyecto"
  step_2_text_li_3: "Elaboramos un informe final de sostenibilidad para evaluar el impacto y concienciar al equipo de cara al futuro"

  step_3_title: "Y si no puedes reducir más, compensamos y certificamos"
  step_3_text: "Cuando hayamos agotado la regla de las 7R: Rediseñar, Reducir, Reutilizar, Reparar, Renovar, Recuperar y Reciclar, ya solo nos queda compensar las emisiones de nuestro proyecto."
  step_3_text_li_1: "Compensamos las emisiones, para ser carbono neutral, reforestando, comprando créditos de carbono o restaurando ecosistemas"
  step_3_text_li_2: "Certificamos cualquier proyecto con los principales sellos del mercado"
  step_3_text_li_3: "Gestionamos por ti una auditoría externa, si lo necesitas"

  form:
    title: "Tu compromiso con la sostenibilidad comienza aquí"

