      lang_info_title: "Importación en español con plantilla estándar de medidas y traducciones opcionales al inglés."
      lang_info_html: >
        <ul class="mb-0 ps-3">
          <li><strong>Plantilla y datos base en ES:</strong> Las columnas <em>A–W</em> deben rellenarse en español. <em>Protocolo</em> puede ser código o nombre. <em>Categoría GHG</em>, <em>Categoría</em>, <em>Bloque</em>, <em>Departamentos</em>, <em>ODS</em>, <em>ESG</em>, <em>Alcance</em>, <em>Áreas de impacto</em>, <em>Triple balance</em> y <em>Fuentes de verificación</em> deben existir en el catálogo de medidas correspondiente.</li>
          <li><strong>Campos múltiples:</strong> <em>Departamentos</em>, <em>ODS</em>, <em>Áreas de impacto</em> y <em>Triple balance</em> aceptan valores separados por <code>;</code>. <em>Fuentes de verificación</em> usa el formato <code>1. Foto | 2. Factura / Albarán | 3. Certif. / Licencia</code>.</li>
          <li><strong>Campos EN opcionales:</strong> Las columnas <em>S–W</em> son opcionales y se guardan como traducciones (<code>en</code>).</li>
          <li><strong>Puntuación (1–5):</strong> La columna <em>J</em> acepta enteros entre 1 y 5.</li>
          <li><strong>Obligatoria:</strong> La columna <em>K</em> acepta <em>Sí</em>/<em>No</em> (también se admiten <code>yes/no</code>, <code>true/false</code>, <code>1/0</code>).</li>
          <li><strong>Descarga de plantilla:</strong> La plantilla siempre se genera en ES para garantizar coherencia.</li>
        </ul>
