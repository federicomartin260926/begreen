    '003': "Estáis construyendo algo que el equipo va a agradecer. Aunque no siempre lo digan."
    '004': "Ya no es un propósito. Es un plan con forma, con decisiones y con un equipo detrás."
    '005': "Cada cosa que marcáis aquí se convierte en instrucciones concretas para el equipo en el set."
    '006': "El equipo que llega a este set llega a un proyecto que ya pensó en ellos antes de empezar."
    '007': "Esto empieza a tener forma. Y los equipos lo notan cuando trabajan en algo que tiene forma."
    '008': "Bienvenidos al nivel donde las decisiones empiezan a tener impacto real en el día a día del set."
    '009': "Vuestra producción ya tiene algo que muchas no tienen: un rumbo claro hacia algo mejor."
    '010': "El equipo trabaja mejor cuando sabe que alguien pensó en todo esto antes de que ellos llegaran."
