welcome:
  seed:
    '001': "Cada gran rodaje empieza con una decisión. Esta es la vuestra."
    '002': "El equipo que construye esto hoy es el que rueda diferente mañana."
    '003': "Alguien tiene que empezar. Y ese alguien sois vosotros."
    '004': "El primer paso de un set sostenible empieza aquí, mucho antes del primer día de rodaje."
    '005': "Este es el momento en que un rodaje decide qué tipo de rodaje quiere ser."
    '006': "Bienvenidos. Lo que construyáis aquí llegará al set antes que cualquier camión de equipo."
    '007': "Un set consciente empieza por personas que se hacen las preguntas correctas. Ya las estáis haciendo."
    '008': "Esto es el comienzo. Y los comienzos son siempre el momento más importante."
    '009': "El equipo que llegue a este set llegará a algo que alguien cuidó antes de que ellos aparecieran."
    '010': "No hace falta tenerlo todo claro para empezar. Solo hace falta empezar."
