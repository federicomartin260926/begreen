services:
  php:
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    volumes:
      - app_var:/app/var
      - app_uploads:/app/public/uploads

  nginx:
    depends_on:
      - php
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_var:/app/var:ro
      - app_uploads:/app/public/uploads:ro

  db:
    ports: []
