services:
  php:
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
    volumes:
      - ./.env.local:/app/.env.local:ro
      - app_var:/app/var
      - app_uploads:/app/public/uploads
      - app_build:/app/public/build

  nginx:
    depends_on:
      - php
    networks:
      - default
      - proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_var:/app/var:ro
      - app_uploads:/app/public/uploads:ro
      - app_build:/app/public/build:ro

  db:
    ports: []

networks:
  proxy:
    external: true
