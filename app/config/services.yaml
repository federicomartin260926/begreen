# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    ai.empty_api_key: ''
    contact_email: '%env(CONTACT_EMAIL)%'
    app.mail_from: '%env(APP_MAIL_FROM)%'
    ai.provider: '%env(string:AI_PROVIDER)%'
    ai.timeout_seconds: '%env(int:AI_TIMEOUT_SECONDS)%'
    ai.min_measure_score: '%env(int:AI_MIN_MEASURE_SCORE)%'
    ai.alert_email: '%env(string:AI_ALERT_EMAIL)%'
    ai.report_storage_dir: '%kernel.project_dir%/var/storage/ai'
    ai.report_prompt_file: '%kernel.project_dir%/config/ai_report_prompt.yaml'
    ai.report_lock_wait_seconds: 120
    openai.api_key: '%env(default:ai.empty_api_key:AI_API_KEY)%'
    openai.model: '%env(string:AI_MODEL)%'
    openai.base_url: '%env(string:AI_BASE_URL)%'
    anthropic.api_key: '%env(default:ai.empty_api_key:ANTHROPIC_API_KEY)%'
    anthropic.model: '%env(string:ANTHROPIC_MODEL)%'
    anthropic.base_url: '%env(string:ANTHROPIC_BASE_URL)%'
    anthropic.api_version: '%env(string:ANTHROPIC_API_VERSION)%'
    anthropic.max_tokens: '%env(int:ANTHROPIC_MAX_TOKENS)%'
    communication_files_directory: '%kernel.project_dir%/public/uploads/communication_files'
    stripe.secret_key: '%env(string:STRIPE_SECRET_KEY)%'
    stripe.webhook_secret: '%env(string:STRIPE_WEBHOOK_SECRET)%'
    stripe.success_url: '%env(string:STRIPE_SUCCESS_URL)%'
    stripe.cancel_url: '%env(string:STRIPE_CANCEL_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Controller\HomeController:
        arguments:
            $contactEmail: '%contact_email%'

    App\Security\LoginSuccessHandler:
        arguments:
            $router: '@router'
            $httpUtils: '@security.http_utils'

    #Esto hace que Symfony pueda inyectar los repositorios en los servicios
    App\Repository\:
        resource: '../src/Repository'
        tags: ['doctrine.repository_service']

    Twig\Extra\String\StringExtension: ~

    Symfony\Component\Translation\TranslatorBagInterface: '@translator'

    App\Service\PdfService: ~

    App\Service\StripeInvoiceStorageService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ProjectCompanyLogoStorage:
        arguments:
            $projectDir: '%kernel.project_dir%'

    Stripe\StripeClient:
        arguments:
            - { api_key: '%stripe.secret_key%' }

    App\Service\StripeProjectCheckoutService:
        arguments:
            $successUrlTemplate: '%stripe.success_url%'
            $cancelUrlTemplate: '%stripe.cancel_url%'

    App\Service\StripeProjectWebhookService:
        arguments:
            $webhookSecret: '%stripe.webhook_secret%'

    App\Service\SustainabilityPlanCustomMeasureService:
        arguments:
            $fromEmail: '%app.mail_from%'
            $notifyEmail: '%contact_email%'

    App\Service\Ai\AiReportConfiguration:
        arguments:
            $provider: '%ai.provider%'
            $timeoutSeconds: '%ai.timeout_seconds%'
            $minMeasureScore: '%ai.min_measure_score%'
            $alertEmail: '%ai.alert_email%'

    App\Service\Ai\AiReportPromptConfiguration:
        arguments:
            $promptFile: '%ai.report_prompt_file%'

    App\Service\Ai\OpenAiReportConfiguration:
        arguments:
            $apiKey: '%openai.api_key%'
            $model: '%openai.model%'
            $baseUrl: '%openai.base_url%'

    App\Service\Ai\AnthropicReportConfiguration:
        arguments:
            $apiKey: '%anthropic.api_key%'
            $model: '%anthropic.model%'
            $baseUrl: '%anthropic.base_url%'
            $apiVersion: '%anthropic.api_version%'
            $maxTokens: '%anthropic.max_tokens%'

    App\Service\Ai\AiQuotaAlertNotifier:
        arguments:
            $environment: '%kernel.environment%'
            $fromEmail: '%app.mail_from%'

    App\Service\Ai\ConfiguredAiReportProvider:
        arguments:
            $openAiProvider: '@App\Service\Ai\OpenAiReportProvider'
            $anthropicProvider: '@App\Service\Ai\AnthropicReportProvider'

    App\Service\Ai\AiReportProviderInterface: '@App\Service\Ai\ConfiguredAiReportProvider'

    App\Service\Ai\AiReportStorage:
        arguments:
            $storageDirectory: '%ai.report_storage_dir%'

    App\Service\Ai\FilesystemAiReportLock:
        arguments:
            $lockDirectory: '%ai.report_storage_dir%/.locks'
            $waitSeconds: '%ai.report_lock_wait_seconds%'

    App\Service\Ai\AiReportLockInterface: '@App\Service\Ai\FilesystemAiReportLock'

    App\Twig\AppExtension:
        tags: ['twig.extension']

    App\EventSubscriber\LocaleSubscriber:
        arguments:
            $defaultLocale: '%kernel.default_locale%'

    Gedmo\Translatable\TranslatableListener: '@stof_doctrine_extensions.listener.translatable'

    App\EventSubscriber\TranslatableLocaleSubscriber:
        arguments:
            $translatableListener: '@stof_doctrine_extensions.listener.translatable'
        tags: ['kernel.event_subscriber']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
