services:
  php:
    volumes:
      - ./:/app
      - app_vendor:/app/vendor
      - app_node_modules:/app/node_modules
      - app_var:/app/var
      - app_uploads:/app/public/uploads

  nginx:
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/app:ro
      - app_var:/app/var:ro
      - app_uploads:/app/public/uploads:ro
      - app_build:/app/public/build:ro

  db:
    ports:
      - "127.0.0.1:${APP_DB_PORT:-3307}:3306"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: begreen-phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MARIADB_USER:-begreen}
      PMA_PASSWORD: ${MARIADB_PASSWORD:-begreen}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${APP_PMA_PORT:-8081}:80"

  mailpit:
    image: axllent/mailpit:latest
    container_name: begreen-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${APP_MAILPIT_WEB_PORT:-8025}:8025"
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_WEB_BIND_ADDR: 0.0.0.0:8025

volumes:
  app_vendor:
  app_node_modules:
